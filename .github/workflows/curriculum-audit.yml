name: Audit chess lesson answers
on:
  push:
    branches: ['fix/accurate-lesson-exercises']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y stockfish
      - run: node scripts/audit-curriculum.mjs
